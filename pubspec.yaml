name: rattil
description: "Jawwid (جَوِّد) — a Tajweed study companion built around the Level-2 'Simplifying Tajweed' books."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.4.3
  # pdfrx 2.5+ requires Flutter >= 3.47; 2.4.8 is the newest release that
  # supports the installed Flutter 3.44 SDK. PDFium-based, MIT licensed.
  pdfrx: 2.4.8
  path_provider: ^2.1.5
  flutter_local_notifications: 22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/books/
    - assets/content/
    - assets/images/
    - assets/images/lessons/
    - assets/fonts/licenses/

  fonts:
    # Arabic & Kurdish reading text (Naskh), SIL OFL 1.1
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-w400.ttf
          weight: 400
        - asset: assets/fonts/NotoNaskhArabic-w500.ttf
          weight: 500
        - asset: assets/fonts/NotoNaskhArabic-w700.ttf
          weight: 700
    # Arabic & Kurdish interface controls, SIL OFL 1.1
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-w400.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic-w500.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic-w600.ttf
          weight: 600
        - asset: assets/fonts/NotoSansArabic-w700.ttf
          weight: 700
    # Arabic & Kurdish headings, SIL OFL 1.1
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
          weight: 400
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    # Qur'anic examples only, SIL OFL 1.1
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    # English & Indonesian reading text and headings, SIL OFL 1.1
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-w400.ttf
          weight: 400
        - asset: assets/fonts/Literata-w600.ttf
          weight: 600
        - asset: assets/fonts/Literata-w700.ttf
          weight: 700
    # English & Indonesian interface controls, SIL OFL 1.1
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-w400.ttf
          weight: 400
        - asset: assets/fonts/Inter-w500.ttf
          weight: 500
        - asset: assets/fonts/Inter-w600.ttf
          weight: 600
        - asset: assets/fonts/Inter-w700.ttf
          weight: 700
